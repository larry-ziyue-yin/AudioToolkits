data:
  recursive: true
  audio_extensions: [".wav", ".flac"]
  gen_suffix: "_gen"
  gt_suffix: "_gt"
  src_suffix: "_whisper"
  eval_src: false
  manifest: null
  missing_policy: "skip"
  scan_progress: true
  gt_text_path: metrics_result/aishell6_gt_text_simple.txt

asr:
  enabled: true
  backend: "whisper"
  model_name: "turbo"
  language: "zh"
  convert_to_simplified: true
  beam_size: 5
  task: "transcribe"
  fp16: true
  force_script_defaults: true
  write_flush_every: 50
  output_path: null
  output_path_src: null
  device: "auto"

output:
  output_dir: null
  save_intermediate: true
  overwrite: false
  cache_dir: pretrained_models/eval_models

parallel:
  enabled: true
  devices: "auto"   # "auto" | "cuda" | "cpu" | ["cuda:0", "cuda:1"]
  workers_per_device: 1
  chunk_size: 8
  precompute_asr: true

metrics:
  - name: dnsmos
    personalized: false
    include_raw: false
    cache_scores: true
  - name: secs
    pair_with: gt
    # pair_with: ref
    # ref_token: "_ref_"
  - name: cer
    cluster: Mandarin
  - name: wer
  - name: utmos
  - name: wvmos
  #   model_path: null
  - name: wespeaker_sim
    model_path: pretrained_models/wespeaker/voxblink2_samresnet34_ft/voxblink2_samresnet34_ft
  - name: wavlm_sim
    model_name_or_path: "microsoft/wavlm-base-plus-sv"
  - name: nisqa
    model_path: null
  - name: speechbertscore
    ref_type: audio
    model_type: wavlm-large
    layer: 14
    sr: 16000
    use_gpu: true
    score_type: precision


